name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  doxygen:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for peaceiris/actions-gh-pages to push gh-pages branch

    concurrency:
      group: ${{ github.ref }}-docs
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Doxygen, Graphviz, and Eigen3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen graphviz libeigen3-dev

      - name: Build Doxygen docs
        run: |
          doxygen Doxyfile
        # WARN_AS_ERROR = YES in Doxyfile causes a non-zero exit on undocumented
        # symbols or mismatched @param tags, failing the job on doc regressions.

      - name: Upload docs artifact (PR preview)
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/html/
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@4f9cc6ed67f966f92ec4dbdc62a1e69bf0e9e7fe  # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          publish_branch: gh-pages
          commit_message: "docs: auto-deploy from ${{ github.sha }}"
