name: Windows CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    runs-on: windows-2022

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-windows-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\packages
          key: vcpkg-${{ matrix.arch }}-eigen3-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-${{ matrix.arch }}-eigen3-

      - name: Install Eigen3 via vcpkg
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          vcpkg install "eigen3:$triplet"

      - name: Configure
        run: |
          $triplet  = if ("${{ matrix.arch }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          $platform = if ("${{ matrix.arch }}" -eq "x64") { "x64" } else { "Win32" }
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$triplet" `
            -A "$platform"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          Set-Location build
          ctest --output-on-failure -C Release

      - name: Package library
        run: |
          New-Item -ItemType Directory -Path dist/lib, dist/include -Force | Out-Null
          Copy-Item build/lib/Release/controller_toolbox.lib dist/lib/
          Copy-Item lib/*.h dist/include/
          Compress-Archive -Path dist/* -DestinationPath "controller_toolbox_windows_${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: controller_toolbox_windows_${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release (tag + changelog)
        id: prep
        uses: ./.github/actions/prepare-release

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64

      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x86

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version }}
          name: Release ${{ steps.prep.outputs.version }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            controller_toolbox_windows_x64.zip
            controller_toolbox_windows_x86.zip
