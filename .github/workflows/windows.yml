name: Windows CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    runs-on: windows-2022

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-windows-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Eigen3 via vcpkg
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          vcpkg install "eigen3:$triplet"

      - name: Configure
        run: |
          $triplet  = if ("${{ matrix.arch }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          $platform = if ("${{ matrix.arch }}" -eq "x64") { "x64" } else { "Win32" }
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$triplet" `
            -A "$platform"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          Set-Location build
          ctest --output-on-failure -C Release

      - name: Package library
        run: |
          New-Item -ItemType Directory -Path dist/lib, dist/include -Force | Out-Null
          Copy-Item build/lib/Release/controller_toolbox.lib dist/lib/
          Copy-Item lib/*.h dist/include/
          Compress-Archive -Path dist/* -DestinationPath "controller_toolbox_windows_${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: controller_toolbox_windows_${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'project\(ControllerToolbox VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Generate changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 --match "*.*.*" \
            $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            git log --no-merges --pretty="- %s (%an)" "$PREV"..HEAD > CHANGELOG.md
          else
            git log --no-merges --pretty="- %s (%an)" > CHANGELOG.md
          fi

      - name: Download x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x64

      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x86

      - name: Create release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            controller_toolbox_windows_x64.zip
            controller_toolbox_windows_x86.zip
