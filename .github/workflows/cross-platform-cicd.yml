name: Cross-Platform CI/CD

# Single source of truth for continuous integration and distribution.
#
#   push / pull_request -> main : build + test on Linux, Windows, macOS
#                                  (C++ library, tests, Python bindings, sanitizers)
#   push tag v*.*.*            : build release artifacts + GitHub Release
#                                  + build wheels + publish to PyPI
#
# CI matrix jobs are skipped on tag pushes (the tag is cut from a main commit
# that already passed CI); release/publish jobs run only on tag pushes.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

jobs:
  # ===========================================================================
  # CI - Linux (x86_64 + x86 cross-compile)
  # ===========================================================================
  linux:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]

    runs-on: ubuntu-latest
    permissions:
      contents: read

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-linux-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC-13 and multilib
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/ppa -y
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13 gcc-13-multilib g++-13-multilib
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 60 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - name: Print GCC version
        run: gcc --version

      - name: Install Eigen3 and nlohmann-json
        run: sudo apt-get install -y libeigen3-dev nlohmann-json3-dev

      - name: Configure (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13

      - name: Configure (x86 cross-compile)
        if: matrix.arch == 'x86'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Install pybind11 (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: sudo apt-get install -y pybind11-dev python3-dev python3-numpy

      - name: Build Python bindings (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          cmake -S . -B build_py \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCTRL_BUILD_PYTHON_BINDINGS=ON
          cmake --build build_py --parallel $(nproc) --target ctrl_toolbox

      - name: Smoke test Python bindings (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: python3 bindings/smoke_test.py

      - name: Upload Python binding (x86_64 only)
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-toolbox-linux-x86_64-so
          path: build_py/bindings/ctrl_toolbox*.so
          retention-days: 30

      - name: ASAN/UBSAN Debug build (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          cmake -S . -B build_san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build_san --parallel $(nproc)
          cd build_san && ctest --output-on-failure

  # ===========================================================================
  # CI - Windows C++ (MSVC x64 + x86 via vcpkg)
  # ===========================================================================
  windows:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]

    runs-on: windows-2022
    permissions:
      contents: read

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-windows-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\packages
          key: vcpkg-${{ matrix.arch }}-eigen3-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: vcpkg-${{ matrix.arch }}-eigen3-

      - name: Install Eigen3 via vcpkg
        run: |
          $triplet = if ("${{ matrix.arch }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          vcpkg install "eigen3:$triplet"

      - name: Configure
        run: |
          $triplet  = if ("${{ matrix.arch }}" -eq "x64") { "x64-windows-static" } else { "x86-windows-static" }
          $platform = if ("${{ matrix.arch }}" -eq "x64") { "x64" } else { "Win32" }
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="$triplet" `
            -A "$platform"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          Set-Location build
          ctest --output-on-failure -C Release

  # ===========================================================================
  # CI - Windows Python bindings (MSYS2 MinGW64 + conda env)
  # ===========================================================================
  windows-python:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2022
    permissions:
      contents: read

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-windows-python
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build toolchain only (no MSYS2 Python/pybind11 - those come from conda).
      - name: Set up MSYS2 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-eigen3

      # Creates (or updates) the 'soft_robotics' conda env from environment.yml:
      # Python + pybind11 + numpy + scipy, matching local-dev ABI for the .pyd.
      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: soft_robotics
          auto-activate-base: false

      - name: Build Python bindings
        shell: pwsh
        run: |
          # Put MSYS2 tools (cmake, ninja, gcc) first on PATH so 'conda run'
          # finds them even though conda prepends its own bin dir.
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"

          # 'conda run' resets the environment, so CMake cannot see the MSYS2
          # eigen3 config via the default search paths. Point CMAKE_PREFIX_PATH
          # at the MSYS2 prefix AND enable the FetchContent fallback so the
          # binding configures whether or not the system Eigen is discoverable.
          $env:CMAKE_PREFIX_PATH = "C:\msys64\mingw64;$env:CMAKE_PREFIX_PATH"

          conda run -n soft_robotics --no-capture-output cmake `
            -S . -B build_py `
            -DCMAKE_BUILD_TYPE=Release `
            -DCTRL_BUILD_PYTHON_BINDINGS=ON `
            -DCTRL_FETCH_EIGEN_IF_MISSING=ON `
            -G Ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          conda run -n soft_robotics --no-capture-output cmake `
            --build build_py --target ctrl_toolbox
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test Python bindings
        shell: pwsh
        run: |
          # The .pyd was linked against MinGW64 runtime DLLs; add their directory
          # to PATH so Windows DLL loader can find them at import time.
          # (Each step runs in a fresh shell so PATH set during build is gone.)
          $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          conda run -n soft_robotics --no-capture-output python bindings/smoke_test.py

      - name: Upload ctrl_toolbox binding
        uses: actions/upload-artifact@v4
        with:
          name: ctrl-toolbox-windows-x64-pyd
          path: build_py/bindings/ctrl_toolbox*.pyd
          retention-days: 30

  # ===========================================================================
  # CI - macOS (Apple clang via Homebrew)
  # ===========================================================================
  macos:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    permissions:
      contents: read

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-macos
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Homebrew deps
        run: |
          set -eux
          brew update || true
          brew install cmake python eigen nlohmann-json pybind11 || true
          pip3 install --break-system-packages numpy || pip3 install numpy

      - name: Print compiler
        run: clang --version || true

      - name: Configure (macOS)
        run: cmake -B build_macos -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_macos --parallel

      - name: Test
        run: cd build_macos && ctest --output-on-failure

      - name: Build Python bindings
        run: |
          cmake -S . -B build_py_macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTRL_BUILD_PYTHON_BINDINGS=ON
          cmake --build build_py_macos --parallel --target ctrl_toolbox

      - name: Smoke test Python bindings
        run: python3 bindings/smoke_test.py

  # ===========================================================================
  # RELEASE - build install artifacts (tags only)
  # ===========================================================================
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: ctrl_toolbox-linux
          - os: windows-latest
            artifact: ctrl_toolbox-windows
          - os: macos-latest
            artifact: ctrl_toolbox-macos

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Eigen3 (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libeigen3-dev

      - name: Install Eigen3 (macOS)
        if: runner.os == 'macOS'
        run: brew install eigen

      # Windows has no system Eigen here; the FetchContent fallback supplies it.
      - name: Configure (Release)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCTRL_BUILD_PYTHON_BINDINGS=OFF
          -DCTRL_BUILD_BENCHMARKS=OFF
          -DCTRL_FETCH_EIGEN_IF_MISSING=ON

      - name: Build library
        run: cmake --build build --config Release --target controller_toolbox

      - name: Install to staging
        run: cmake --install build --prefix staging --config Release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: cd staging && zip -r ../${{ matrix.artifact }}-${{ github.ref_name }}.zip .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path staging\* -DestinationPath "${{ matrix.artifact }}-${{ github.ref_name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

  # ===========================================================================
  # RELEASE - create GitHub Release (tags only)
  # ===========================================================================
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.0.8
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ===========================================================================
  # PUBLISH - build wheels (tags only)
  # ===========================================================================
  wheels:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@7940a4c0e76eb2030e473a5f864f291f63ee879b  # v2.21.3
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* *-win32 *-manylinux_i686"
          # Eigen3 inside the build container/VM (fetch fallback if package missing).
          CIBW_BEFORE_BUILD_LINUX: >
            yum install -y eigen3-devel || apt-get install -y libeigen3-dev || true
          CIBW_BEFORE_BUILD_MACOS: brew install eigen
          CIBW_BEFORE_BUILD_WINDOWS: >
            vcpkg install eigen3:x64-windows
          CIBW_ENVIRONMENT_WINDOWS: >
            CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          CIBW_TEST_COMMAND: >
            python -c "import ctrl_toolbox as ctrl; assert ctrl.registry_has('discrete_pid'), 'Registry missing discrete_pid'; print('ctrl_toolbox OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/

  # ===========================================================================
  # PUBLISH - upload to PyPI (tags only)
  # ===========================================================================
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
