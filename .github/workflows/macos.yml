name: macOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false

    runs-on: macos-latest
    permissions:
      contents: read

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-macos
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Homebrew deps
        run: |
          set -eux
          brew update || true
          brew install cmake python eigen nlohmann-json pybind11 || true
          pip3 install --break-system-packages numpy || pip3 install numpy

      - name: Print compiler
        run: clang --version || true

      - name: Configure (macOS)
        run: |
          cmake -B build_macos \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_macos --parallel

      - name: Test
        run: cd build_macos && ctest --output-on-failure

      - name: Build Python bindings
        run: |
          cmake -S . -B build_py_macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DCTRL_BUILD_PYTHON_BINDINGS=ON
          cmake --build build_py_macos --parallel --target ctrl_toolbox

      - name: Smoke test Python bindings
        run: python3 bindings/smoke_test.py

      - name: Package library
        run: |
          mkdir -p dist/lib dist/include
          cp build_macos/lib/libcontroller_toolbox.a dist/lib/ || true
          cp lib/*.h dist/include/ || true
          tar czf controller_toolbox_macos_x86_64.tar.gz -C dist . || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: controller_toolbox_macos_x86_64.tar.gz
