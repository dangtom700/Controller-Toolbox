name: Ubuntu CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, x86]

    runs-on: ubuntu-latest
    permissions:
      contents: read

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-ubuntu-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GCC-13 and multilib
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/ppa -y
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13 gcc-13-multilib g++-13-multilib
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 60 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-13

      - name: Print GCC version
        run: gcc --version

      - name: Install Eigen3 and nlohmann-json
        run: sudo apt-get install -y libeigen3-dev nlohmann-json3-dev

      - name: Configure (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13

      - name: Configure (x86 cross-compile)
        if: matrix.arch == 'x86'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="-m32" \
            -DCMAKE_C_FLAGS="-m32" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: cd build && ctest --output-on-failure

      - name: Install pybind11 (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: sudo apt-get install -y pybind11-dev python3-dev

      - name: Build Python bindings (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          cmake -S . -B build_py \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCTRL_BUILD_PYTHON_BINDINGS=ON
          cmake --build build_py --parallel $(nproc) --target ctrl_toolbox

      - name: Smoke test Python bindings (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: python3 bindings/smoke_test.py

      - name: ASAN/UBSAN Debug build (x86_64 only)
        if: matrix.arch == 'x86_64'
        run: |
          cmake -S . -B build_san \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build build_san --parallel $(nproc)
          cd build_san && ctest --output-on-failure

      - name: Package library
        run: |
          mkdir -p dist/lib dist/include
          cp build/lib/libcontroller_toolbox.a dist/lib/
          cp lib/*.h dist/include/
          tar czf controller_toolbox_linux_${{ matrix.arch }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: controller_toolbox_linux_${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release (tag + changelog)
        id: prep
        uses: ./.github/actions/prepare-release

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64

      - name: Download x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version }}
          name: Release ${{ steps.prep.outputs.version }}
          body_path: CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            controller_toolbox_linux_x86_64.tar.gz
            controller_toolbox_linux_x86.tar.gz
