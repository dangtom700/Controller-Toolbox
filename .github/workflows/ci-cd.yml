name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # for creating releases & uploading assets
  packages: write          # for pushing Docker images to ghcr.io
  security-events: write   # for optional MSVC analysis (if you re‑enable it)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/controller-toolbox
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  # --------------------------------------------------------------------------
  # 1. Build and test on Linux (gcc, clang) and Windows (MSVC)
  # --------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.os }} (${{ matrix.c_compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # Linux dependencies (Eigen3, nlohmann-json, ninja, coverage tools)
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libeigen3-dev nlohmann-json3-dev ninja-build \
            lcov gcovr

      # Windows: install Eigen 3.4.0 and nlohmann/json via vcpkg
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.zip" -OutFile eigen.zip
          Expand-Archive eigen.zip -DestinationPath C:\eigen
          cmake -B C:\eigen\eigen-3.4.0\build -S C:\eigen\eigen-3.4.0 `
                -DCMAKE_INSTALL_PREFIX=C:\eigen\install -DBUILD_TESTING=OFF
          cmake --install C:\eigen\eigen-3.4.0\build
          vcpkg install nlohmann-json:x64-windows

      # Configure CMake (Linux)
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B ${{ env.BUILD_DIR }} -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DENABLE_COVERAGE=ON

      # Configure CMake (Windows)
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DEigen3_DIR=C:/eigen/install/share/eigen3/cmake \
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      # Build
      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      # Run CTest
      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --build-config Release --output-on-failure --verbose

      # Code coverage (only Linux/GCC)
      - name: Generate coverage report
        if: runner.os == 'Linux' && matrix.c_compiler == 'gcc'
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          lcov --capture --directory . --output-file coverage.info --no-external
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/case-study/*' '*/build/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.c_compiler == 'gcc'
        uses: codecov/codecov-action@v4
        with:
          file: ${{ env.BUILD_DIR }}/coverage.info
          flags: unittests
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # 2. Static analysis with clang-tidy (Linux only)
  # --------------------------------------------------------------------------
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y clang-tidy libeigen3-dev nlohmann-json3-dev
      - name: Configure CMake with clang-tidy
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_CLANG_TIDY="clang-tidy" \
            -DCMAKE_CXX_STANDARD=20
      - name: Run clang-tidy (build fails if issues found)
        run: cmake --build build

  # --------------------------------------------------------------------------
  # 3. Docker build & push (only on main branch push or tag)
  # --------------------------------------------------------------------------
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 4. Create GitHub Release (on tags)
  # --------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          git archive --format=tar.gz --output=controller-toolbox-${{ github.ref_name }}.tar.gz ${{ github.ref_name }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            controller-toolbox-${{ github.ref_name }}.tar.gz
            *sbom.spdx.json
          generate_release_notes: true
          draft: false
          prerelease: false