name: Documentation

# Builds the Doxygen API documentation on every push/PR to main.
# On push to main, deploys the generated HTML to GitHub Pages using the
# official first-party Pages actions (no third-party action SHAs to pin).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Allow one concurrent deployment; cancel in-progress runs of the same ref.
concurrency:
  group: ${{ github.ref }}-documentation
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Doxygen, Graphviz, and Eigen3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y doxygen graphviz libeigen3-dev

      - name: Build Doxygen docs
        run: doxygen Doxyfile
        # WARN_AS_ERROR = YES in Doxyfile makes the job fail on undocumented
        # symbols or mismatched @param tags, catching doc regressions early.

      - name: Upload docs artifact (PR preview)
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/html/
          retention-days: 14

      # Package the HTML as a Pages artifact only when we intend to deploy.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    # Deploy only on push to main; PRs just build + upload the preview artifact.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write       # deploy to GitHub Pages
      id-token: write     # OIDC token for the Pages deployment

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
