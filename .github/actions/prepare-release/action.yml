name: Prepare Release
description: >
  Extracts the version from CMakeLists.txt, creates a git tag (idempotent),
  and generates CHANGELOG.md from the commit log since the previous tag.
  Shared by ubuntu.yml and windows.yml to avoid copy-paste drift.

outputs:
  version:
    description: Semver string extracted from CMakeLists.txt (e.g. "1.2.3").
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Extract version
      id: version
      shell: bash
      run: |
        VERSION=$(grep -oP 'project\(ControllerToolbox VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Create or verify tag
      shell: bash
      run: |
        git fetch --tags
        if git rev-parse "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "Tag ${{ steps.version.outputs.version }} already exists — skipping creation."
        else
          git config user.email "action@github.com"
          git config user.name  "GitHub Action"
          git tag -a "${{ steps.version.outputs.version }}" \
            -m "Release ${{ steps.version.outputs.version }}"
          # Push may fail if a concurrent job created the tag between our check and push.
          git push origin "${{ steps.version.outputs.version }}" || \
            echo "Tag push failed — likely a concurrent job already pushed it."
        fi

    - name: Generate changelog
      shell: bash
      run: |
        PREV=$(git describe --tags --abbrev=0 --match "*.*.*" \
          $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
        if [ -n "$PREV" ]; then
          git log --no-merges --pretty="- %s (%an)" "$PREV"..HEAD > CHANGELOG.md
        else
          git log --no-merges --pretty="- %s (%an)" > CHANGELOG.md
        fi
